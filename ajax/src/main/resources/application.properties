spring.application.name=ajax

# 데이터 소스 - MySQL

# 기본 데이터 소스
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/aloha?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&autoReconnection=true&autoReconnection=true
spring.datasource.username=aloha
spring.datasource.password=123456

# Mybatis 설정
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.aloha.ajax.dto

# Mybatis 매퍼 파일 경로 : ~/메인패키지/mapper/**Mapper.xml
mybatis.mapper-locations=classpath:**/mapper/*.xml

# 로그 레벨 설정

# level : TRACE, DEBUG, INFO, WARN, ERROR
logging.level.com.aloha.board=INFO

# ANSI 컬러 출력 설정
spring.output.ansi.enabled=ALWAYS

# 로그 레벨을 높여서 에러를 자세히 봅니다
logging.level.root=info
logging.level.com.aloha.ajax=debug 
# (위의 'shop'은 패키지명입니다. 본인의 패키지명으로 바꾸세요 ex: com.example.demo)

# SQL 실행 내역을 출력합니다 (DB 오류 잡을 때 필수)
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl